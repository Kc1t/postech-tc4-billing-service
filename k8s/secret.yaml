# Modelo. No CI o Secret é criado com `kubectl create secret ... --from-literal` a partir dos
# secrets do GitHub; os valores abaixo são só marcadores — nunca versione credenciais reais.
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secret
  labels:
    app: billing-service
type: Opaque
stringData:
  JWT_SECRET: CHANGE_ME
  POSTGRES_DSN: CHANGE_ME
  MP_ACCESS_TOKEN: ""
  MP_WEBHOOK_SECRET: ""
  NEW_RELIC_LICENSE_KEY: ""
