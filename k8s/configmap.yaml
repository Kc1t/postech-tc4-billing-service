apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  labels:
    app: billing-service
    app.kubernetes.io/part-of: oficina
data:
  APP_PORT: "8082"
  APP_ENV: "prod"
  LOG_LEVEL: "info"
  NEW_RELIC_APP_NAME: "billing-service-NAMESPACE_PLACEHOLDER"
  CORS_ALLOWED_ORIGINS: "CORS_ORIGINS_PLACEHOLDER"
  DB_MAX_OPEN_CONNS: "10"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "30m"
  # Mensageria: credenciais vêm do role do node (LabRole no Learner Lab).
  AWS_REGION: "AWS_REGION_PLACEHOLDER"
  SQS_BILLING_COMMANDS_URL: "https://sqs.AWS_REGION_PLACEHOLDER.amazonaws.com/ACCOUNT_ID_PLACEHOLDER/billing-commands"
  SNS_BILLING_EVENTS_ARN: "arn:aws:sns:AWS_REGION_PLACEHOLDER:ACCOUNT_ID_PLACEHOLDER:billing-events"
  OUTBOX_POLL_INTERVAL: "500ms"
  FAULT_INJECTION_ENABLED: "FAULT_INJECTION_PLACEHOLDER"
  # Gateway de pagamento: mercadopago (credenciais de teste no Secret) ou fake (demonstração).
  PAYMENT_GATEWAY: "PAYMENT_GATEWAY_PLACEHOLDER"
  MP_BASE_URL: "https://api.mercadopago.com"
  # Rota pública do webhook no API Gateway (POST /api/v1/webhooks/mercadopago, sem authorizer).
  MP_NOTIFICATION_URL: "API_GATEWAY_URL_PLACEHOLDER/api/v1/webhooks/mercadopago"
  MP_TIMEOUT: "5s"
  MP_PREFERENCE_TTL: "24h"
  MP_WEBHOOK_MAX_AGE: "0s"
  FAKE_CHECKOUT_BASE_URL: "API_GATEWAY_URL_PLACEHOLDER"
  READINESS_TIMEOUT: "2s"
  SHUTDOWN_TIMEOUT: "20s"
