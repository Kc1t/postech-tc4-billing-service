# Ambiente local do billing-service: API + Postgres + LocalStack (SNS/SQS com a mesma topologia do
# Terraform, criada por deploy/localstack/init-aws.sh — cópia do script do os-service).
#
# Portas do host configuráveis (para rodar junto com os outros serviços):
#   BILLING_SERVICE_PORT (8082) · BILLING_POSTGRES_PORT (5434) · LOCALSTACK_PORT (4566)
services:
  billing-service:
    build: .
    container_name: billing-service
    ports:
      - "${BILLING_SERVICE_PORT:-8082}:8082"
    env_file:
      - path: .env
        required: false
    environment:
      APP_PORT: "8082"
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/billing?sslmode=disable
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_BILLING_COMMANDS_URL: http://localstack:4566/000000000000/billing-commands
      SNS_BILLING_EVENTS_ARN: arn:aws:sns:us-east-1:000000000000:billing-events
      FAULT_INJECTION_ENABLED: "true"
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      FAKE_CHECKOUT_BASE_URL: http://localhost:${BILLING_SERVICE_PORT:-8082}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: billing-postgres
    ports:
      - "${BILLING_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing
    volumes:
      - billing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: billing-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      # dynamodb: o init-aws.sh compartilhado também cria a tabela do execution-service.
      SERVICES: sns,sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # Pronto quando os scripts de init (filas, tópicos, tabelas) terminaram sem erro. O endpoint responde
      # em milissegundos; o awslocal leva uns 3 s para subir e estourava o timeout.
      test: ["CMD-SHELL", "r=$$(curl -sf localhost:4566/_localstack/init/ready) && echo \"$$r\" | grep -q '\"completed\": true' && ! echo \"$$r\" | grep -q ERROR"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  billing-postgres-data:
